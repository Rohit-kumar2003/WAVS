<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan Result</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">

    <h1 class="text-3xl font-bold mb-6 text-center">Scan Results for {{ url }}</h1>

    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow-md mb-8">
        <h2 class="text-2xl font-semibold mb-4">Nikto Scan Result:</h2>
        <pre class="bg-gray-200 p-4 rounded overflow-x-auto">{{ nikto_result }}</pre>
    </div>

    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow-md mb-8">
        <h2 class="text-2xl font-semibold mb-4">ZAP Scan Findings:</h2>
        <ul class="list-disc pl-6">
            {% for alert in zap_alerts %}
                <li class="mb-2">
                    <strong>{{ alert.alert }}</strong> - Risk: {{ alert.risk }} <br>
                    <em>{{ alert.description }}</em>
                </li>
            {% endfor %}
        </ul>
    </div>

    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow-md">
        <h2 class="text-2xl font-semibold mb-4">Vulnerabilities Chart</h2>
        <canvas id="scanChart"></canvas>
    </div>

    <script> 
        const ctx = document.getElementById('scanChart').getContext('2d');
        const scanChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['High', 'Medium', 'Low'],
                datasets: [{
                    label: 'Detected Vulnerabilities',
                    data: [
                        {{ severity_counts.high }},
                        {{ severity_counts.medium }},
                        {{ severity_counts.low }}
                    ],
                    backgroundColor: ['#ef4444', '#f59e0b', '#10b981'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                },
                animation: {
                    duration: 2000,
                    easing: 'easeOutBounce'
                }
            }
        });
    </script>

</body>
</html>

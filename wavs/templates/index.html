<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web App Vulnerability Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">Web Vulnerability Scanner</h1>
        <form action="/scan" method="post">
            <input type="text" name="url" placeholder="Enter Target URL" required class="w-full px-4 py-2 border rounded mb-4">
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                Start Scan
            </button>
        </form>
    </div>
</body>
</html>
